name: build

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-vs2022
            build: windows-vs2022-debug
            test: windows-vs2022-debug
          - os: ubuntu-latest
            preset: linux-ninja
            build: linux-debug
            test: linux-debug
          - os: macos-latest
            preset: macos-ninja
            build: macos-debug
            test: macos-debug
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.2.x'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtshadertools'
          cache: true
      - name: Install vcpkg dependencies
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
            "$RUNNER_TEMP/vcpkg/vcpkg.exe" install catch2:x64-windows ffmpeg:x64-windows miniaudio:x64-windows --classic
          else
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
            "$RUNNER_TEMP/vcpkg/vcpkg" install catch2 ffmpeg miniaudio --classic
          fi
      - name: Configure
        shell: bash
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
        run: cmake --preset "${{ matrix.preset }}"
      - name: Build
        shell: bash
        run: cmake --build --preset "${{ matrix.build }}" --parallel 4
      - name: Test
        shell: bash
        run: ctest --preset "${{ matrix.test }}" --output-on-failure
      - name: Validate release metadata and stage installation
        shell: bash
        run: |
          cmake --build "build/${{ matrix.preset }}" --target yaap_release_gate
          cmake --install "build/${{ matrix.preset }}" --config Debug --prefix "${GITHUB_WORKSPACE}/build/staged-${{ matrix.preset }}"
      - name: Create package
        shell: bash
        working-directory: build/${{ matrix.preset }}
        run: cpack -C Debug
      - uses: actions/upload-artifact@v4
        with:
          name: Yaap-${{ matrix.os }}
          path: build/${{ matrix.preset }}/Yaap-*
          if-no-files-found: error

  linux-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.2.x'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtshadertools'
      - name: Install dependencies
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          "$RUNNER_TEMP/vcpkg/vcpkg" install catch2 ffmpeg miniaudio --classic
      - name: Configure, build, and test with sanitizers
        shell: bash
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
        run: |
          cmake --preset linux-ninja -DYAAP_ENABLE_SANITIZERS=ON
          cmake --build --preset linux-debug --parallel 4
          ctest --preset linux-debug --output-on-failure
