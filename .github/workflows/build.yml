name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  VCPKG_DISABLE_METRICS: 1
  VCPKG_TAG: 2026.07.29

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-vs2022
            build: windows-vs2022-debug
            test: windows-vs2022-debug
          - os: ubuntu-latest
            preset: linux-ninja
            build: linux-debug
            test: linux-debug
          - os: macos-latest
            preset: macos-ninja
            build: macos-debug
            test: macos-debug
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.2.x'
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtshadertools'
          cache: true
      - name: Install vcpkg dependencies
        shell: bash
        run: |
          git clone --branch "$VCPKG_TAG" --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
            "$RUNNER_TEMP/vcpkg/vcpkg.exe" install catch2:x64-windows ffmpeg:x64-windows miniaudio:x64-windows --classic
          else
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
            "$RUNNER_TEMP/vcpkg/vcpkg" install catch2 ffmpeg miniaudio --classic
          fi
      - name: Configure
        shell: bash
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
        run: cmake --preset "${{ matrix.preset }}"
      - name: Build
        shell: bash
        run: cmake --build --preset "${{ matrix.build }}"
      - name: Test
        shell: bash
        run: ctest --preset "${{ matrix.test }}" --output-on-failure
      - name: Validate release metadata and stage installation
        shell: bash
        run: |
          cmake --build "build/${{ matrix.preset }}" --target yaap_release_gate
          cmake --install "build/${{ matrix.preset }}" --config Debug --prefix "${GITHUB_WORKSPACE}/build/staged-${{ matrix.preset }}"
      - name: Create package
        shell: bash
        working-directory: build/${{ matrix.preset }}
        run: cpack -C Debug
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: Yaap-${{ matrix.os }}
          path: build/${{ matrix.preset }}/Yaap-*
          if-no-files-found: error
          retention-days: 14

  linux-sanitizers:
    name: Linux sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.2.x'
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtshadertools'
          cache: true
      - name: Install dependencies
        shell: bash
        run: |
          git clone --branch "$VCPKG_TAG" --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          "$RUNNER_TEMP/vcpkg/vcpkg" install catch2 ffmpeg miniaudio --classic
      - name: Configure, build, and test with sanitizers
        shell: bash
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
        run: |
          cmake --preset linux-ninja -DYAAP_ENABLE_SANITIZERS=ON
          cmake --build --preset linux-debug
          ctest --preset linux-debug --output-on-failure
