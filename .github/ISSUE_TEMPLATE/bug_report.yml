name: Bug report
description: Report a reproducible problem in Yaap
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Yaap. Do not include passwords, tokens, private URLs, or personal media metadata. Report security issues privately as described in SECURITY.md.
  - type: input
    id: revision
    attributes:
      label: Version or commit
      description: Paste the Yaap version or Git commit you tested.
      placeholder: "0.2.0 or 3f903d8"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS version, architecture, compiler, Qt version, and build type.
      placeholder: "Windows 11 x64, MSVC 2022, Qt 6.8.3, Debug"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Local playback
        - Internet radio
        - OpenSubsonic
        - Jellyfin
        - Provider extension
        - UI or theme mod
        - Library and playlists
        - Packaging or startup
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that causes the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove credentials, private server URLs, usernames, and personal media metadata first.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials and private information from this report.
          required: true

